<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon/favicon-16x16.png">
    <link rel="stylesheet" href="./css/style.css">
    <title>pokedex</title>
</head>
<body>
    <main>
        <img src="./images/images (1).jfif" class="pokemon-img" alt="">

        <h1 class="pokemon-data">
            <span class="pokemon-number">666</span> -
            <span class="pokemon-name">dante</span>
        </h1>
        
        <form class="form">
            <input 
            type="search"
            class="input-search"
            placeholder="Name or number"
            required
            />
        </form>
        <img src="./images/pokedex.png" class="pokedex" alt="pokedex">
    </main>
    
</body>
</html>
